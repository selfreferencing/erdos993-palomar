fidelity:
  divergences: |-
    Two comparisons, both made by AI systems on statements (for arXiv v1 also on the authors' change records);
    Lean proofs were not read for either.

    PART A. Against arXiv:2610.07943v1, the public version.
    Same as that paper: the main theorem; the window (Proposition 2.3, Corollary 2.5); the decomposition and
    mixture (Lemma 2.2, Proposition 3.2); the choice of activity (Lemmas 3.6 to 3.8, Theorem 3.9, Proposition
    3.10); the moment criterion (Theorem 3.5, with one Laplace constraint); Lemma 4.30; the statements, constants
    and starting means of Theorems 4.3, 4.22 and 5.5.
    Different: (a) Theorem 4.3: other multipliers; exact rational comparisons replace interval checks.
    (b) Theorem 4.40: only the tilt 0, with an explicit rate. (c) Theorem 4.22: nine activity rows, another local
    payment. (d) Theorem 5.6 below the starting means: 28 certificates replace 779 boxes; lower edge 4/q.
    (e) Section 5.3, Appendix B: proved anew, without interval arithmetic. (f) Theorem 6.1: a sharper mode bound;
    203 parameter triples. (g) Sections 7 and 8 describe another Lean development (411 compiled evaluations, five
    axioms).

    PART B. Against version 2.15, the text the Lean follows (deposited with restricted access).
    Compared text: version 2.15 of the manuscript. The comparison was made by AI systems, on statements only, for
    all 93 numbered theorems, propositions and lemmas of version 2.13, at an earlier commit of the Lean. Version
    2.14 corrected Lemma 6.9 and made eleven few-word edits towards the Lean; version 2.15 carries short remarks at
    Lemma 5.21 and Subsection 5.8 that state the differences.
    Differences that remain against version 2.15:
    1. Theorem 5.1 on rows D, E1, E2, H: the Lean statement is the printed one, the proof is not. The Lean follows
       a later construction of T. Zhang (Remark 9.1). Subsection 5.8 (Theorem 5.33, Lemmas 5.34 to
       5.51, Tables 3 to 11), Appendix B (Table 20) and Table 18 describe objects the Lean does not contain; the
       counts printed in Subsection 1.5 for these rows describe Subsection 5.8, not the Lean.
    2. On those rows the Lean tail threshold is X <= 5/16 (row D) and X <= 1/4 (rows E1, E2, H) with conclusion
       Z_w > 0; the text prints the threshold 1/8 and the bound Z_w > p/40 (Table 1, last column; Lemma 5.32).
    3. Subsections 5.5 and 5.7 (Theorem 5.24, Lemmas 5.22, 5.25, 5.31, 5.32) and the chain and leaf clauses of
       Theorem 5.26 are not used by the final theorem.
    4. Lemma 5.21 has no Lean counterpart; the manuscript does not use it.
    5. The sentence before Table 2 prints integer polynomials of exact degrees; the Lean proves degree bounds only.
    6. Theorem 2.4: same statement; the Lean proof on the path is an earlier one that includes a kernel check of
       181 + 247 integer pairs absent from the printed proof. Lemma 2.3 is not used.
    7. Theorem 7.1 (at most 24 vertices): same statement; a Hall-type matching argument replaces alternating paths,
       and the classification of Subsection 7.3 is replaced by kernel evaluation over 203 parameter triples.
    8. Proof-level differences inside Lemmas 5.9 and 5.18 and in three places of Section 6 (Theorems 6.13, 6.15,
       Lemma 6.17). Some Lean statements are split, stronger, or carry a harmless extra hypothesis (Lemma 5.29).
    Not compared: proofs; supplementary data not printed in the text; several tables in part only.

review:
  status: "agent-reviewed"
  reviewers:
    - "AI review sessions in Claude Code (automated): rebuild from source and axiom audit of each part; comparison of Lean statements and transcribed tables with the manuscript"
    - "Kernel checkers (automated): Lean's leanchecker, NanoDa and con-ron on the complete export; the registry's Comparator"
  notes: >-
    K. Vallier directed the project. He does not read Lean; he checked the statements of Challenge.lean against a
    line-by-line plain-language gloss prepared by an AI system and confirmed that they state the conjecture; he
    proposed a formal statement for forests publicly on 16 August 2026 (formal-conjectures issue 5012); he has not
    checked the proofs. All Lean was produced by AI systems, T. Zhang's library by an AI system that he operated; he
    states that he has not read its Lean code. T. Zhang had an AI system review the statement file Challenge.lean
    line by line, and has himself read lines 67 to 97 of that file, which contain its four declarations (his
    statements of 9 October 2026); these are the only lines of Lean code he has read, and he has not read the
    proofs. No human has read the Lean proofs. Every comparison of the Lean with the manuscript was made by AI
    systems, on statements only. No independent human expert review is claimed. On the manuscript's mathematics: T.
    Zhang and W. Li have read the first four sections of the manuscript (T. Zhang, 9 October 2026) and have not yet
    revised them; no human has yet read the remaining sections' proofs in full. Machine checks: four complete runs
    on a tree whose code is that of this one (it differs in comments, LICENSE, README.md and formalization.yaml; a
    fresh build of the comment-revised tree gave a byte-identical export): the complete export was accepted by
    leanchecker, NanoDa and con-ron (9,949 s, 10,038 s and 10,260 s in total with the build, 16 vCPU and 32 GB) and
    by the registry's sandboxed Comparator (10,108 s). The checkers were not re-run after the comment revision.

