# formalization.yaml v0.4. 9 October 2026.
version: "v0.4"

project:
  name: "Unimodality of the independence sequence of a finite forest (Erdős Problem 993)"
  description: >-
    A Lean 4 and Mathlib formalization of the theorem that the independence sequence of every finite forest is
    unimodal: the numbers of independent sets with 0, 1, 2, ... vertices weakly increase up to some index and
    weakly decrease after it. This is the statement listed as Erdős Problem 993; later sources attribute the
    question to a 1987 paper of Alavi, Malde, Schwenk and Erdős. The first claimed proof for all finite forests is
    by T. Zhang and W. Li (self-archived preprints, September 2026). This repository formalizes a second proof, by
    W. Li, K. Vallier and T. Zhang: it adapts the public arXiv:2610.07943v1 and follows version 2.15 of that
    manuscript, deposited with restricted access and under revision. The Lean proof is computer-assisted and in
    two parts (at most 24 vertices; at least 25). About 13,700 finite computations are evaluated by the Lean
    kernel, without native_decide, on the three standard axioms. AI systems produced and reviewed all of the
    Lean; no human has read the Lean proofs. No manuscript cited is peer reviewed. No priority and no first
    formalization is claimed.
  authors: ["Kevin Vallier", "Tong Zhang"]
  license: "Apache-2.0"
  responsible_maintainers: ["Kevin Vallier"]

