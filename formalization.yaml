status:
  scope: >-
    The full theorem: the independence sequence of every finite forest is unimodal (Erdos993.erdos_993_forest), and
    in particular that of every finite tree (Erdos993.erdos_993). No weaker statement and no extra hypothesis. Not
    claimed: log-concavity (false for trees from 26 vertices on), any bound on the position of the peak, or any
    statement beyond forests.
  sorry_count: 0  # Solution and everything it imports; the two statement placeholders of Challenge.lean are excluded.
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - {declaration: "Erdos993.erdos_993_forest", file: "Solution.lean", sorry_count: 0, axioms: ["propext", "Classical.choice", "Quot.sound"], comparator_config: "comparator.json"}
    - {declaration: "Erdos993.erdos_993", file: "Solution.lean", sorry_count: 0, axioms: ["propext", "Classical.choice", "Quot.sound"], comparator_config: "comparator.json"}

